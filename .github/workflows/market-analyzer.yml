name: Rinkos analizė, Automatinis Pirkimas ir Telegram signalai

on:
  schedule:
    # Pirmadieniais–Penktadieniais: Europos sesija (08:35 UTC), JAV atidarymas (14:45 UTC), JAV uždarymas (20:35 UTC)
    - cron: '35 8 * * 1-5'
    - cron: '45 14 * * 1-5'
    - cron: '35 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-and-trade:
    runs-on: ubuntu-latest
    steps:
      - name: Atsisiųsti repozitoriją
        uses: actions/checkout@v4

      - name: Paruošti Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vykdyti rinkos analizę ir siųsti Telegram ataskaitą
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/invest-pulsas/
        run: |
          python3 scripts/analyze_market.py --notify

      - name: Vykdyti automatinį pirkimą / pardavimą pas brokerį (iki 100 €/mėn.)
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          T212_ENV: ${{ secrets.T212_ENV }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_ENV: ${{ secrets.ALPACA_ENV }}
          MONTHLY_BUDGET_EUR: ${{ secrets.MONTHLY_BUDGET_EUR }}
          AUTO_TRADE_ENABLED: ${{ secrets.AUTO_TRADE_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/auto_trader.py --mode auto

      - name: Atnaujinti duomenis GitHub Pages puslapiui (telefonui)
        run: |
          git config user.name "InvestPulsas Bot"
          git config user.email "actions@github.com"
          git add data/market_signals.json data/auto_trade_state.json
          if git diff --staged --quiet; then
            echo "Pokyčių nėra."
          else
            git commit -m "chore(auto): atnaujinti signalai ir auto-prekybos busena $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
